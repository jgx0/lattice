<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
<title id="title">Lattice reader layout</title><desc id="description">Illustration, not a screenshot: an Obsidian-style reader with file navigation on the left, linked notes in the center, and a graph and outline on the right.</desc>
<rect width="1280" height="760" rx="16" fill="#141318"/>
<rect x="20" y="20" width="1240" height="720" rx="10" fill="#1e1e1e" stroke="#39363f"/>
<path d="M30 20H278V740H30Q20 740 20 730V30Q20 20 30 20" fill="#262626"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="45" y="70" fill="#d9d8dc" font-size="20" font-weight="600">Lattice</text>
<rect x="44" y="95" width="209" height="32" rx="4" fill="#303030" stroke="#3c3c3c"/><text x="56" y="116" fill="#88858d" font-size="12">Search page or heading…</text>
<g fill="#aaa7af" font-size="13"><text x="47" y="165">⌄ About</text><text x="66" y="194">Lattice</text><text x="66" y="223">Documentation</text><text x="66" y="252">Quick start</text><text x="66" y="281">Obsidian themes</text><text x="66" y="310">Deployment</text><text x="47" y="365">⌄ Field Notes</text><text x="66" y="394">Attention is a material</text><rect x="44" y="409" width="209" height="28" rx="4" fill="#3a3741"/><text x="66" y="428" fill="#dad7e3">Digital gardens</text><text x="66" y="460">Walking as research</text><text x="47" y="515">⌄ Library</text><text x="66" y="544">The reading room</text></g>
<g transform="translate(325 70)"><text fill="#e3e1e8" font-size="32" font-weight="700">Digital gardens</text><g fill="#c3c0c8" font-size="16"><text y="58">Notes are more useful when their connections remain visible.</text><text y="86">Lattice publishes those connections without changing the vault.</text></g><text y="150" fill="#e3e1e8" font-size="23" font-weight="600">A note is a place to return</text><g fill="#c3c0c8" font-size="16"><text y="192">Follow a thread through a note, preview a destination, and keep</text><text y="220">reading. The file tree and outline are always close at hand.</text></g><rect y="256" width="626" height="82" rx="5" fill="#7852ee18"/><text x="16" y="282" fill="#b69eea" font-size="15" font-weight="600">Connected reading</text><text x="16" y="310" fill="#c3c0c8" font-size="14">Hover a wikilink to preview it. Open another note beside this one.</text><text y="400" fill="#e3e1e8" font-size="23" font-weight="600">Your theme, without imitation</text><g fill="#c3c0c8" font-size="16"><text y="442">Use the CSS already installed in Obsidian, including snippets</text><text y="470">and publish.css. Everything is compiled before deployment.</text></g><text y="536" fill="#b49be9" font-size="16" text-decoration="underline">Obsidian themes</text><text x="170" y="536" fill="#86818c">·</text><text x="186" y="536" fill="#b49be9" font-size="16" text-decoration="underline">Documentation</text></g>
<g transform="translate(1000 66)"><text fill="#a19da8" font-size="13">Interactive graph</text><rect y="20" width="234" height="185" rx="5" fill="#242424" stroke="#353535"/><g stroke="#68616e" fill="none"><path d="M24 90L70 55L130 106L202 71L182 161L100 165L24 90M70 55L100 165L202 71M130 106L182 161"/></g><g fill="#9e91bb"><circle cx="24" cy="90" r="4"/><circle cx="70" cy="55" r="4"/><circle cx="202" cy="71" r="4"/><circle cx="182" cy="161" r="4"/><circle cx="100" cy="165" r="4"/></g><circle cx="130" cy="106" r="7" fill="#b499ed"/><text y="255" fill="#a19da8" font-size="13">On this page</text><g fill="#aaa5b2" font-size="12"><text x="9" y="285">A note is a place to return</text><text x="9" y="314">Your theme, without imitation</text></g><text y="380" fill="#a19da8" font-size="13">Linked mentions</text><g fill="#aaa5b2" font-size="12"><text x="9" y="410">Documentation</text><text x="9" y="439">Welcome</text></g></g>
<text x="28" y="751" fill="#766e84" font-size="10">READER LAYOUT ILLUSTRATION · LATTICE</text>
</g></svg>
